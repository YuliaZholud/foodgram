server {
    listen 80;
    server_name 89.169.186.95 foodgram-yulia.duckdns.org;

    index index.html;
    server_tokens off;

    # === Статическая документация по /api/docs/ ===
    # Файлы лежат в /usr/share/nginx/html/api/docs/
    location /api/docs/ {
        alias /usr/share/nginx/html/api/docs/;
        index redoc.html;
    }

    # === статика и медиа ===
    location /static/ {
        alias /static/;
    }

    location /media/ {
        alias /media/;
    }

    # === админка Django ===
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === API Django ===
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # короткие ссылки
    location /s/ {
        proxy_pass http://backend:8000/s/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === фронт ===
    # index.html лежит в /static (туда всё копирует контейнер frontend)
    location / {
        root /static;
        try_files $uri /index.html;
    }
}
