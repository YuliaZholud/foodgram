server {
    listen 80;

    server_name 89.169.186.95 foodgram-yulia.duckdns.org;

    # Статика React-приложения (frontend)
    location /static/ {
        alias /static/;
    }

    # Медиа-файлы Django (картинки рецептов и т.п.)
    location /media/ {
        alias /media/;
    }

    # Админка Django
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё остальное — SPA (React)
    location / {
        root /static;
        try_files $uri /index.html;
    }
}
