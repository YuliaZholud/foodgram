version: '3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:14
    env_file: .env
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    image: zholud229/foodgram_backend
    restart: always
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/backend_static
      - media:/app/media

  frontend:
    build: ./frontend
    image: zholud229/foodgram_frontend
    restart: always
    env_file: .env
    command: cp -r /app/build/. /static/
    volumes:
      - static:/static

  gateway:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    image: zholud229/foodgram_gateway
    restart: always
    env_file: .env
    depends_on:
      - backend
      - frontend
    ports:
      - "8001:80"
    volumes:
      - static:/static
      - media:/media
